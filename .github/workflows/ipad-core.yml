name: iPad Regression

on:
  push:
    branches:
      - ipad-native
    paths:
      - "ipad/**"
      - ".github/workflows/ipad-core.yml"
  pull_request:
    paths:
      - "ipad/**"
      - ".github/workflows/ipad-core.yml"

concurrency:
  group: ipad-regression-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  regression:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Swift toolchain
        working-directory: ipad
        run: swift --version

      - name: Build and test HondaAnalyzerCore
        working-directory: ipad
        run: swift test

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        working-directory: ipad
        run: xcodegen generate

      - name: Build iPad app
        working-directory: ipad
        run: |
          xcodebuild \
            -project HondaAnalyzer.xcodeproj \
            -scheme HondaAnalyzer \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
