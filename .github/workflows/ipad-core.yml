name: iPad Regression

on:
  push:
    branches:
      - ipad-native
    paths:
      - "ipad/**"
      - ".github/workflows/ipad-core.yml"
  pull_request:
    paths:
      - "ipad/**"
      - ".github/workflows/ipad-core.yml"

jobs:
  swift-test:
    runs-on: macos-15
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ipad
    steps:
      - uses: actions/checkout@v4
      - name: Swift toolchain
        run: swift --version
      - name: Build and test HondaAnalyzerCore
        run: swift test

  ipad-app-build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Generate Xcode project
        working-directory: ipad
        run: xcodegen generate
      - name: Build iPad app
        working-directory: ipad
        run: |
          xcodebuild \
            -project HondaAnalyzer.xcodeproj \
            -scheme HondaAnalyzer \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
