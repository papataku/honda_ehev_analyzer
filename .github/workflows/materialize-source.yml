name: Materialize canonical v0.3.4 source

on:
  push:
    paths:
      - '.github/workflows/materialize-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Reconstruct and verify v0.3.4 release
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA256="bae24021b3ca8b1587817821f2db7799ccac3f9dc707aecad962382a30c20d3d"

          test -d _bootstrap_v034_verified
          test -f _bootstrap_v034_verified/part.000

          cat _bootstrap_v034_verified/part.* > /tmp/v034.b64
          base64 --decode /tmp/v034.b64 > /tmp/v034.zip
          echo "${EXPECTED_SHA256}  /tmp/v034.zip" | sha256sum -c -

          rm -rf /tmp/v034-release
          mkdir -p /tmp/v034-release
          unzip -q /tmp/v034.zip -d /tmp/v034-release

          PYP="$(find /tmp/v034-release -maxdepth 3 -type f -name pyproject.toml -print -quit)"
          test -n "$PYP"
          SOURCE_DIR="$(dirname "$PYP")"

          grep -q 'version = "0.3.4"' "$SOURCE_DIR/pyproject.toml"
          test -f "$SOURCE_DIR/src/honda_analyzer/gui/app.py"
          test -f "$SOURCE_DIR/src/honda_analyzer/build_info.py"
          test -f "$SOURCE_DIR/tests/test_phase34_long_did_buffer_recovery.py"

          mkdir -p src tests docs signals
          rsync -a --delete "$SOURCE_DIR/src/" src/
          rsync -a --delete "$SOURCE_DIR/tests/" tests/
          rsync -a "$SOURCE_DIR/docs/" docs/
          rsync -a --delete "$SOURCE_DIR/signals/" signals/
          cp "$SOURCE_DIR/pyproject.toml" pyproject.toml
          cp "$SOURCE_DIR/README.md" README.md
          cp "$SOURCE_DIR/Preflight.command" Preflight.command
          cp "$SOURCE_DIR/Run Honda Analyzer.command" "Run Honda Analyzer.command"

          find src tests -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache

          # Repository-only context/policy files remain in place because docs rsync is non-delete.
          rm -rf _bootstrap _bootstrap_v034_fixed _import_v034 _bootstrap_v034_verified
          rm -f .github/workflows/materialize-source.yml

      - name: Install project and run regression
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pytest -q
          python -m compileall -q src

      - name: Commit canonical source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No source-tree changes to commit."
            exit 0
          fi
          git commit -m "chore: canonicalize Honda e:HEV Analyzer v0.3.4 source"
          git push origin HEAD:main
