name: Canonical source bootstrap status

on:
  push:
    paths:
      - '.github/workflows/materialize-source.yml'
      - 'tools/bootstrap_v034_from_zip.sh'
      - 'docs/BOOTSTRAP_CANONICAL_SOURCE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report canonical-source state
        shell: bash
        run: |
          if [[ -f src/honda_analyzer/gui/app.py &&                 -f src/honda_analyzer/build_info.py &&                 -f tests/test_phase34_long_did_buffer_recovery.py ]]; then
            echo "Canonical source tree is materialized."
          else
            echo "::warning::Canonical v0.3.4 bootstrap is still pending (Issue #1)."
            echo "Run tools/bootstrap_v034_from_zip.sh with the verified release ZIP."
          fi
